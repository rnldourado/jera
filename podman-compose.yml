version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ${DB_HOST:-jera-postgres}
    environment:
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-jera_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - jera-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-jera-app}
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DB_DIALECT=${DB_DIALECT:-postgres}
      - DB_HOST=${DB_HOST:-jera-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_PASS=${DB_PASS:-password}
      - DB_USER=${DB_USER:-postgres}
      - DB_NAME=${DB_NAME:-jera_db}
      - APP_PORT=${APP_PORT:-3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - jera-network

volumes:
  postgres_data:

networks:
  jera-network:
    driver: bridge
